<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital · Meta Ads Palmira · T3 JUN26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-red: #ea4128;
    --brand-red-soft: rgba(234, 65, 40, 0.12);
    --brand-red-strong: #ff5a3d;
    --brand-white: #d7ddda;
    --brand-black: #1a1a1a;
    --bg: #0c0c0e;
    --bg-card: #18181b;
    --bg-card-2: #1f1f23;
    --bg-elevated: #25252a;
    --text: #f5f5f7;
    --text-2: #a1a1aa;
    --text-3: #6b6b70;
    --border: #2a2a2f;
    --border-2: #3a3a40;
    --success: #1d9e75;
    --success-soft: rgba(29, 158, 117, 0.14);
    --warning: #d4941e;
    --warning-soft: rgba(212, 148, 30, 0.14);
    --danger: #d83d3d;
    --danger-soft: rgba(216, 61, 61, 0.16);
    --info: #3a86c0;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1400px; margin: 0 auto; padding: 16px 16px 60px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--brand-red); display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .brand-sub { font-size: 11px; color: var(--text-3); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    background: var(--brand-red-soft); color: var(--brand-red);
    border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-red); animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(234,65,40,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(234,65,40,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,65,40,0); }
  }
  .btn {
    border: 1px solid var(--border-2); background: var(--bg-card);
    color: var(--text); padding: 8px 14px; border-radius: 8px; font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { background: var(--bg-elevated); border-color: var(--brand-red); }

  .page-title { font-size: 30px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 6px; }
  .page-title span { color: var(--brand-red); }
  .page-sub { color: var(--text-2); font-size: 13px; margin-bottom: 24px; }

  .section-title {
    margin: 32px 0 12px; font-size: 11px; font-weight: 700; color: var(--text-3);
    letter-spacing: 0.14em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Alertas */
  .alerts { display: grid; gap: 8px; margin-bottom: 4px; }
  .alert-card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px; border-radius: var(--radius-md);
    border: 1px solid; font-size: 13px;
  }
  .alert-card.danger  { background: var(--danger-soft);  border-color: var(--danger);  color: #ff8484; }
  .alert-card.warning { background: var(--warning-soft); border-color: var(--warning); color: #f0b248; }
  .alert-card.success { background: var(--success-soft); border-color: var(--success); color: #4ed5a4; }
  .alert-icon { font-size: 18px; line-height: 1; }
  .alert-title { font-weight: 700; }
  .alert-text { color: var(--text-2); font-size: 12px; margin-top: 3px; }
  .alert-card.danger .alert-text { color: #f5b8b8; }
  .alert-card.warning .alert-text { color: #e9d3a8; }
  .alert-card.success .alert-text { color: #b5e6d2; }

  /* KPIs grandes */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .kpi {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px 18px; position: relative; overflow: hidden;
  }
  .kpi-label { font-size: 11px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .kpi-value { font-size: 30px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; }
  .kpi-sub { font-size: 12px; color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .kpi-trend { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .kpi-trend.up   { background: var(--success-soft); color: #4ed5a4; }
  .kpi-trend.down { background: var(--danger-soft);  color: #ff8484; }
  .kpi-trend.flat { background: var(--bg-elevated);  color: var(--text-3); }
  .kpi.alert { border-color: var(--danger); background: var(--danger-soft); }
  .kpi.alert .kpi-value { color: #ff8484; }
  .kpi.good { border-color: var(--success); background: var(--success-soft); }
  .kpi.brand-strong { border-color: var(--brand-red); background: var(--brand-red-soft); }
  .kpi.brand-strong .kpi-value { color: var(--brand-red-strong); }

  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em; }
  .card-sub { font-size: 12px; color: var(--text-2); margin-bottom: 16px; }

  /* Evolução chart */
  .evo-wrap { overflow-x: auto; }
  .evo-chart {
    display: grid; align-items: end; gap: 4px; min-width: 100%;
    position: relative;
  }
  .evo-day {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    min-width: 38px; position: relative;
  }
  .evo-bars { display: flex; gap: 2px; align-items: end; height: 140px; }
  .evo-bar {
    width: 12px; border-radius: 2px 2px 0 0; min-height: 1px;
    transition: opacity 0.15s;
  }
  .evo-bar:hover { opacity: 0.65; }
  .evo-bar.gasto { background: var(--brand-red); }
  .evo-bar.compras { background: var(--brand-white); }
  .evo-cpl-line { position: absolute; left: 0; right: 0; top: 0; height: 140px; pointer-events: none; }
  .evo-day-label { font-size: 9px; color: var(--text-3); }
  .evo-day-value { font-size: 9px; color: var(--text-2); font-weight: 700; }
  .evo-day.today .evo-day-label { color: var(--brand-red); font-weight: 700; }
  .evo-day.today .evo-bars { border-bottom: 2px solid var(--brand-red); margin-bottom: -2px; }
  .chart-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  /* Funil */
  .funnel { display: grid; gap: 8px; }
  .funnel-row {
    display: grid; grid-template-columns: 160px 1fr 130px 110px;
    gap: 12px; align-items: center;
  }
  .funnel-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
  .funnel-bar-bg {
    background: var(--bg-elevated); height: 26px; border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border); position: relative;
  }
  .funnel-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--brand-red), var(--brand-red-strong));
    border-radius: 3px;
    display: flex; align-items: center; padding-left: 8px;
    font-size: 11px; color: #fff; font-weight: 700;
  }
  .funnel-value { font-size: 14px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .funnel-pct {
    font-size: 12px; font-weight: 700; text-align: right;
    padding: 3px 8px; border-radius: 4px;
    background: var(--success-soft); color: #4ed5a4;
  }
  .funnel-pct.low { background: var(--warning-soft); color: #f0b248; }
  .funnel-pct.bad { background: var(--danger-soft); color: #ff8484; }
  .funnel-pct.empty { background: transparent; color: var(--text-3); }

  /* Retenção vídeo */
  .video-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 4px; }
  .video-step {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 14px 8px; text-align: center;
    position: relative; overflow: hidden;
  }
  .video-step::before {
    content: ''; position: absolute; left: 0; bottom: 0; right: 0;
    height: var(--fill, 0%); background: var(--brand-red-soft); z-index: 0;
  }
  .video-step > * { position: relative; z-index: 1; }
  .video-step-label { font-size: 10px; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .video-step-value { font-size: 18px; font-weight: 800; color: var(--brand-red-strong); }
  .video-step-sub { font-size: 10px; color: var(--text-2); margin-top: 3px; }

  /* Heatmap */
  .heat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); gap: 6px; }
  .heat-cell {
    border-radius: 6px; padding: 10px 8px; text-align: center;
    border: 1px solid var(--border);
    transition: transform 0.1s;
    cursor: default;
  }
  .heat-cell:hover { transform: translateY(-2px); }
  .heat-day { font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; }
  .heat-value { font-size: 13px; font-weight: 800; margin-top: 4px; }
  .heat-sub { font-size: 9px; opacity: 0.85; margin-top: 2px; }
  .heat-cell.today { outline: 2px solid var(--brand-red); }

  /* Tabela completa */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta-full-wrap { overflow-x: auto; max-width: 100%; border-radius: var(--radius-md); }
  .meta-full { min-width: 2000px; font-size: 11px; border-collapse: separate; border-spacing: 0; }
  .meta-full th, .meta-full td { padding: 7px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .meta-full thead th {
    position: sticky; top: 0; background: var(--bg-elevated);
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; z-index: 2;
  }
  .meta-full tbody tr:hover { background: rgba(234, 65, 40, 0.04); }
  .meta-full tbody tr.today-row { background: var(--brand-red-soft); }
  .meta-full tbody tr.total-row { background: var(--bg-card-2); font-weight: 800; border-top: 2px solid var(--brand-red); }
  .meta-full tbody tr.total-row td { color: var(--brand-red-strong); }
  .meta-full td.day-cell {
    position: sticky; left: 0; background: var(--bg-card); font-weight: 700;
    border-right: 1px solid var(--border-2); z-index: 1;
  }
  .meta-full tbody tr.today-row td.day-cell { background: rgba(234,65,40,0.22); }
  .meta-full tbody tr.total-row td.day-cell { background: var(--bg-card-2); color: var(--brand-red-strong); }
  .meta-full th.day-cell {
    position: sticky; left: 0; z-index: 3; background: var(--bg-elevated);
    border-right: 1px solid var(--border-2);
  }
  .meta-full td.alert-cell { color: #ff8484 !important; font-weight: 700; }
  .meta-full td.good-cell  { color: #4ed5a4 !important; font-weight: 700; }

  /* Decisões */
  .decisions { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .decision {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px; position: relative;
  }
  .decision.urgent { border-color: var(--danger); background: var(--danger-soft); }
  .decision.attention { border-color: var(--warning); background: var(--warning-soft); }
  .decision.ok { border-color: var(--success); background: var(--success-soft); }
  .decision-tag {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px; margin-bottom: 10px;
  }
  .decision.urgent .decision-tag    { background: var(--danger);  color: #fff; }
  .decision.attention .decision-tag { background: var(--warning); color: #1a1a1a; }
  .decision.ok .decision-tag        { background: var(--success); color: #fff; }
  .decision-title { font-weight: 800; font-size: 14px; margin-bottom: 8px; letter-spacing: -0.01em; }
  .decision-body { font-size: 12px; color: var(--text-2); line-height: 1.55; }
  .decision-body strong { color: var(--text); }

  .footer {
    margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--text-3); flex-wrap: wrap; gap: 8px;
  }
  .footer .gox { color: var(--brand-red); font-weight: 700; }

  .loading { text-align: center; padding: 60px 20px; color: var(--text-2); }
  .error {
    background: var(--danger-soft); border: 1px solid var(--danger);
    color: #ff8484; padding: 16px; border-radius: var(--radius-md); margin: 20px 0;
    font-size: 13px;
  }

  @media (max-width: 768px) {
    .funnel-row { grid-template-columns: 110px 1fr 90px 70px; }
    .funnel-label { font-size: 11px; }
    .video-bars { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>

<script>
/* ───────── CONFIG ───────── */
const SHEET_PUB_ID = '2PACX-1vTL92tbwQmF3jTydrL6BQm3j1RQk4GUt4e-vrWvA8Wm-9pu0ZakbwUpMJwFXY3IVHbEhcuko2t8Sc6o';
const TAB_GID = '2051502992'; // Leads FB
const csvUrl = () => `https://docs.google.com/spreadsheets/d/e/${SHEET_PUB_ID}/pub?gid=${TAB_GID}&single=true&output=csv&_=${Date.now()}`;
const REFRESH_MS = 5 * 60 * 1000;
const TODAY = new Date();
const todayShort = `${String(TODAY.getDate()).padStart(2,'0')}/${String(TODAY.getMonth()+1).padStart(2,'0')}`;

/* Baseline T2 (de inteligência: 04-comparativo-turmas.md)
   OBS: na campanha da Palmira, "compra" = venda do ingresso SPT (R$ 15-25).
   Logo, "custo por compra" é o CPL real (custo para captar 1 lead/ingresso).
   "Custo por checkout" é métrica intermediária do funil (R$ 5 médio). */
const T2_BASELINE = { cpl: 19.78, ctr: 2.5 };
const ALVO_CPL = 25;       // custo por compra (CPL real)
const ALVO_CPL_PREJUIZO = 30; // acima disso, prejuízo no ticket R$ 15-20

/* ───────── CSV PARSER ───────── */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (inQuotes) {
      if (c === '"' && n === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function toNumber(v) {
  if (v == null) return 0;
  let s = v.toString().trim();
  if (!s || s === '—' || s.startsWith('#')) return 0;
  s = s.replace(/R\$\s*/g, '').replace(/%/g, '').trim();
  // Formato BR: vírgula = decimal, ponto = milhar
  if (s.includes(',')) {
    // tem vírgula → ponto sempre vira milhar
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes('.')) {
    // só ponto: pode ser milhar ou decimal
    const parts = s.split('.');
    if (parts.length > 2) {
      // múltiplos pontos = milhar (ex: 1.234.567)
      s = parts.join('');
    } else if (parts[1].length === 3 && parts[0].length >= 1) {
      // 1 ponto e parte direita com 3 dígitos = milhar (ex: 4.901)
      s = parts.join('');
    }
    // senão mantém como decimal (ex: 1.4)
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
const fmtBRL  = (n) => 'R$ ' + (n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtBRL0 = (n) => 'R$ ' + Math.round(n || 0).toLocaleString('pt-BR');
const fmtInt  = (n) => Math.round(n || 0).toLocaleString('pt-BR');

/* ───────── PARSE ───────── */
function parseLeadsFb(rows) {
  const days = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const dia = (r[0] || '').toString().trim();
    if (!dia || !/^\d{1,2}\/\d{1,2}/.test(dia)) continue;
    const checkout = toNumber(r[1]);
    if (!checkout) continue;
    const diaShort = dia.split('/').slice(0,2).join('/');
    days.push({
      dia, diaShort, checkout,
      custoCheckout: toNumber(r[2]),
      cliques:       toNumber(r[3]),
      compras:       toNumber(r[4]),
      custoCompra:   toNumber(r[5]),
      visPagina:     toNumber(r[6]),
      gasto:         toNumber(r[7]),
      ctr:           toNumber(r[8]),
      cpm:           toNumber(r[9]),
      connectRate:   toNumber(r[10]),
      compraPag:     toNumber(r[11]),
      checkoutPagina:toNumber(r[12]),
      compraCheckout:toNumber(r[13]),
      impressoes:    toNumber(r[14]),
      alcance:       toNumber(r[15]),
      thruplays:     toNumber(r[16]),
      custoThruplay: toNumber(r[17]),
      v25:           toNumber(r[18]),
      v50:           toNumber(r[19]),
      v75:           toNumber(r[20]),
      v95:           toNumber(r[21]),
      v100:          toNumber(r[22]),
      v3seg:         toNumber(r[23]),
      reproducoes:   toNumber(r[24]),
      custo95:       toNumber(r[25]),
      custo100:      toNumber(r[26]),
      freq:          toNumber(r[27])
    });
  }
  return days;
}

/* ───────── ANÁLISE / DECISÕES ───────── */
function analyse(days) {
  if (!days.length) return null;
  const sum = (k) => days.reduce((s,d) => s + (d[k] || 0), 0);
  const avg = (k) => days.length ? sum(k) / days.length : 0;

  const gasto      = sum('gasto');
  const compras    = sum('compras');
  const checkouts  = sum('checkout');
  const cliques    = sum('cliques');
  const visPagina  = sum('visPagina');
  const impressoes = sum('impressoes');
  const alcance    = sum('alcance');
  const thruplays  = sum('thruplays');

  // Janelas: primeira semana vs últimos 3 dias com dados
  const firstWeek = days.slice(0, Math.min(7, days.length));
  const last3     = days.slice(-3);
  const wAvg = (arr, k) => arr.length ? arr.reduce((s,d) => s + (d[k] || 0), 0) / arr.length : 0;

  return {
    days,
    totals: {
      gasto, compras, checkouts, cliques, visPagina, impressoes, alcance, thruplays,
      cpc:      cliques > 0 ? gasto / cliques : 0,
      ctr:      impressoes > 0 ? (cliques / impressoes) * 100 : 0,
      cpm:      impressoes > 0 ? (gasto / impressoes) * 1000 : 0,
      custoChk: checkouts > 0 ? gasto / checkouts : 0,
      custoCpr: compras > 0 ? gasto / compras : 0,
      conexao:  cliques > 0 ? (visPagina / cliques) * 100 : 0,
      taxaCompra: visPagina > 0 ? (compras / visPagina) * 100 : 0,
      freqMedia:  avg('freq')
    },
    trends: {
      custoCprFirst: wAvg(firstWeek, 'custoCompra'),
      custoCprLast:  wAvg(last3,     'custoCompra'),
      custoChkFirst: wAvg(firstWeek, 'custoCheckout'),
      custoChkLast:  wAvg(last3,     'custoCheckout'),
      ctrFirst:      wAvg(firstWeek, 'ctr'),
      ctrLast:       wAvg(last3,     'ctr'),
      freqFirst:     wAvg(firstWeek, 'freq'),
      freqLast:      wAvg(last3,     'freq'),
      gastoFirst:    wAvg(firstWeek, 'gasto'),
      gastoLast:     wAvg(last3,     'gasto')
    }
  };
}

/* ───────── RENDER: alertas inteligentes ───────── */
function renderAlerts(a) {
  const alerts = [];
  const T = a.totals, tr = a.trends;

  // CPL (= custo por compra/ingresso) acima do baseline T2
  if (T.custoCpr > ALVO_CPL_PREJUIZO) {
    alerts.push({
      type: 'danger', icon: '🚨',
      title: `CPL (custo por ingresso) em ${fmtBRL(T.custoCpr)} — acima de R$ ${ALVO_CPL_PREJUIZO}`,
      text: `Com ticket médio de R$ 17, custo > R$ 30 = prejuízo no ingresso. T2 fechou em R$ 19,78. Pausar conjuntos caros.`
    });
  } else if (T.custoCpr > ALVO_CPL) {
    alerts.push({
      type: 'warning', icon: '⚠',
      title: `CPL em ${fmtBRL(T.custoCpr)} — ${(((T.custoCpr/T2_BASELINE.cpl)-1)*100).toFixed(0)}% acima do baseline T2`,
      text: `T2 fechou em R$ 19,78. Buscar criativos com melhor performance e cortar os piores.`
    });
  } else if (T.custoCpr > 0 && T.custoCpr <= 20) {
    alerts.push({
      type: 'success', icon: '✓',
      title: `CPL em ${fmtBRL(T.custoCpr)} — dentro do baseline T2`,
      text: `Performance saudável. Manter e escalar verba nos melhores criativos.`
    });
  }

  // Tendência custo/compra piorando
  if (tr.custoCprLast > tr.custoCprFirst * 1.25 && tr.custoCprFirst > 0) {
    const pct = ((tr.custoCprLast/tr.custoCprFirst - 1) * 100).toFixed(0);
    alerts.push({
      type: 'warning', icon: '📈',
      title: `CPL subiu ${pct}% — primeira semana vs últimos 3 dias`,
      text: `Início: ${fmtBRL(tr.custoCprFirst)} → Agora: ${fmtBRL(tr.custoCprLast)}. Fadiga de criativo ou esgotamento de audiência.`
    });
  }

  // Frequência alta
  if (T.freqMedia > 2.5) {
    alerts.push({
      type: 'warning', icon: '🔁',
      title: `Frequência média ${T.freqMedia.toFixed(2)} — público vendo demais o mesmo anúncio`,
      text: `Recomendado: subir criativos novos OU ampliar segmentação. Acima de 3 começa repulsa.`
    });
  } else if (tr.freqLast > 2.5) {
    alerts.push({
      type: 'warning', icon: '🔁',
      title: `Frequência subindo nos últimos dias (${tr.freqLast.toFixed(2)})`,
      text: `Está pegando o mesmo público de novo. Hora de injetar criativo novo.`
    });
  }

  // CTR baixo
  if (T.ctr < 1.5 && T.ctr > 0) {
    alerts.push({
      type: 'warning', icon: '👁',
      title: `CTR em ${T.ctr.toFixed(2)}% — abaixo de 1,5%`,
      text: `Headline/thumb do criativo não está prendendo. Testar ganchos novos.`
    });
  } else if (T.ctr >= 2.5) {
    alerts.push({
      type: 'success', icon: '✓',
      title: `CTR saudável em ${T.ctr.toFixed(2)}%`,
      text: `Criativos prendendo atenção. Manter ganchos vencedores.`
    });
  }

  // Taxa compra/checkout
  if (T.custoCpr > 0 && T.compraCheckout && T.totals && T.checkouts > 0 && T.compras > 0) {
    const taxa = (T.compras / T.checkouts) * 100;
    if (taxa < 20) {
      alerts.push({
        type: 'warning', icon: '🛒',
        title: `Só ${taxa.toFixed(1)}% dos checkouts viram compra`,
        text: `Conferir página de pagamento, parcelamento, formas de pagamento aceitas.`
      });
    }
  }

  if (alerts.length === 0) {
    alerts.push({
      type: 'success', icon: '✓',
      title: 'Campanha rodando dentro dos parâmetros',
      text: 'Nenhum alerta crítico no momento. Continuar monitorando.'
    });
  }

  return `
    <div class="alerts">
      ${alerts.map(al => `
        <div class="alert-card ${al.type}">
          <div class="alert-icon">${al.icon}</div>
          <div>
            <div class="alert-title">${al.title}</div>
            <div class="alert-text">${al.text}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ───────── RENDER: KPIs grandes ───────── */
function renderKpis(a) {
  const T = a.totals, tr = a.trends;

  const trendIcon = (last, first, inverse = false) => {
    if (!first) return { cls: 'flat', txt: '—' };
    const pct = ((last - first) / first) * 100;
    if (Math.abs(pct) < 5) return { cls: 'flat', txt: 'estável' };
    const isGood = inverse ? pct < 0 : pct > 0;
    return { cls: isGood ? 'up' : 'down', txt: (pct > 0 ? '↑' : '↓') + ' ' + Math.abs(pct).toFixed(0) + '%' };
  };

  const trCustoCpr = trendIcon(tr.custoCprLast, tr.custoCprFirst, true);
  const trCtr      = trendIcon(tr.ctrLast, tr.ctrFirst, false);
  const trFreq     = trendIcon(tr.freqLast, tr.freqFirst, true);

  const cplCls    = T.custoCpr > ALVO_CPL_PREJUIZO ? 'alert' : (T.custoCpr > ALVO_CPL ? '' : (T.custoCpr > 0 ? 'good' : ''));
  const isHighFreq = T.freqMedia > 2.5;
  const isGoodCtr  = T.ctr >= 2.5;
  const isLowCtr   = T.ctr < 1.5 && T.ctr > 0;
  const cplDelta = T2_BASELINE.cpl > 0 ? (((T.custoCpr/T2_BASELINE.cpl)-1)*100).toFixed(0) : '0';

  return `
    <div class="section-title">Resumo da campanha</div>
    <div class="kpi-grid">
      <div class="kpi brand-strong">
        <div class="kpi-label">Investimento total</div>
        <div class="kpi-value">${fmtBRL0(T.gasto)}</div>
        <div class="kpi-sub">${a.days.length} dias · média ${fmtBRL0(T.gasto / a.days.length)}/dia</div>
      </div>
      <div class="kpi ${cplCls}">
        <div class="kpi-label">CPL (custo por ingresso)</div>
        <div class="kpi-value">${fmtBRL(T.custoCpr)}</div>
        <div class="kpi-sub">vs T2 R$ 19,78 (${cplDelta}%) <span class="kpi-trend ${trCustoCpr.cls}">${trCustoCpr.txt}</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Ingressos vendidos</div>
        <div class="kpi-value">${fmtInt(T.compras)}</div>
        <div class="kpi-sub">${fmtInt(T.checkouts)} iniciaram checkout</div>
      </div>
      <div class="kpi ${isGoodCtr ? 'good' : (isLowCtr ? 'alert' : '')}">
        <div class="kpi-label">CTR (link)</div>
        <div class="kpi-value">${T.ctr.toFixed(2)}%</div>
        <div class="kpi-sub">alvo ≥ 2% <span class="kpi-trend ${trCtr.cls}">${trCtr.txt}</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">CPM</div>
        <div class="kpi-value">${fmtBRL(T.cpm)}</div>
        <div class="kpi-sub">CPC ${fmtBRL(T.cpc)} · custo/checkout ${fmtBRL(T.custoChk)}</div>
      </div>
      <div class="kpi ${isHighFreq ? 'alert' : ''}">
        <div class="kpi-label">Frequência média</div>
        <div class="kpi-value">${T.freqMedia.toFixed(2)}</div>
        <div class="kpi-sub">${isHighFreq ? 'Audiência saturando' : 'OK (alvo < 2,5)'} <span class="kpi-trend ${trFreq.cls}">${trFreq.txt}</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Alcance / Impressões</div>
        <div class="kpi-value">${fmtInt(T.alcance)}</div>
        <div class="kpi-sub">${fmtInt(T.impressoes)} impressões</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Compra / página</div>
        <div class="kpi-value">${T.taxaCompra.toFixed(1)}%</div>
        <div class="kpi-sub">conversão final · connect ${T.conexao.toFixed(0)}%</div>
      </div>
    </div>
  `;
}

/* ───────── RENDER: evolução diária ───────── */
function renderEvolution(a) {
  if (!a.days.length) return '';
  const maxGasto = Math.max(...a.days.map(d => d.gasto), 1);
  const maxCompras = Math.max(...a.days.map(d => d.compras), 1);
  const maxCustoCpr = Math.max(...a.days.map(d => d.custoCompra), 1);

  // SVG line para custo/compra por dia
  const W = a.days.length * 42;
  const H = 140;
  const points = a.days.map((d, i) => {
    const x = i * 42 + 21;
    const y = H - (d.custoCompra / maxCustoCpr) * H * 0.9;
    return `${x},${y}`;
  }).join(' ');

  return `
    <div class="section-title">Evolução diária · gasto, compras, custo/compra</div>
    <div class="card">
      <div class="card-title">Performance dia-a-dia</div>
      <div class="card-sub">Barras = gasto e compras · linha branca pontilhada = custo por compra (R$)</div>
      <div class="evo-wrap">
        <div class="evo-chart" style="grid-template-columns: repeat(${a.days.length}, minmax(38px, 1fr)); position: relative;">
          <svg class="evo-cpl-line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width: 100%; height: 140px; position: absolute; left: 0; top: 24px;">
            <polyline points="${points}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
            ${a.days.map((d, i) => {
              const x = i * 42 + 21;
              const y = H - (d.custoCompra / maxCustoCpr) * H * 0.9;
              return `<circle cx="${x}" cy="${y}" r="3" fill="${d.custoCompra > 30 ? '#ff8484' : '#fff'}" />`;
            }).join('')}
          </svg>
          ${a.days.map(d => {
            const isToday = d.diaShort === todayShort;
            const hGasto = (d.gasto / maxGasto) * 100;
            const hCompras = (d.compras / maxCompras) * 100;
            return `
              <div class="evo-day ${isToday ? 'today' : ''}">
                <div class="evo-day-value">${fmtInt(d.compras)}</div>
                <div class="evo-bars">
                  <div class="evo-bar gasto"   style="height: ${hGasto}%"   title="${d.diaShort}: gasto ${fmtBRL(d.gasto)}"></div>
                  <div class="evo-bar compras" style="height: ${hCompras}%" title="${d.diaShort}: ${d.compras} compras · custo ${fmtBRL(d.custoCompra)}"></div>
                </div>
                <div class="evo-day-label">${d.diaShort}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
      <div class="chart-legend">
        <span><span class="legend-dot" style="background: var(--brand-red)"></span>Gasto (R$)</span>
        <span><span class="legend-dot" style="background: var(--brand-white)"></span>Compras</span>
        <span><span class="legend-dot" style="background: #fff; border: 1px dashed #aaa;"></span>Custo por compra</span>
      </div>
    </div>
  `;
}

/* ───────── RENDER: funil ───────── */
function renderFunnel(a) {
  const T = a.totals;
  const max = T.impressoes || 1;
  const rows = [
    { lbl: 'Impressões',         v: T.impressoes, prev: null },
    { lbl: 'Alcance único',      v: T.alcance,    prev: T.impressoes, hint: 'pessoas atingidas' },
    { lbl: 'Cliques no link',    v: T.cliques,    prev: T.impressoes, hint: 'CTR' },
    { lbl: 'Visualizações pág.', v: T.visPagina,  prev: T.cliques,    hint: 'connect rate' },
    { lbl: 'Inícios checkout',   v: T.checkouts,  prev: T.visPagina,  hint: 'iniciaram pagamento' },
    { lbl: 'Compras (ingresso)', v: T.compras,    prev: T.checkouts,  hint: 'conversão final' }
  ];

  return `
    <div class="section-title">Funil de conversão</div>
    <div class="card">
      <div class="card-title">Da impressão à compra</div>
      <div class="card-sub">Largura proporcional ao volume · % vs etapa anterior</div>
      <div class="funnel">
        ${rows.map(r => {
          const w = (r.v / max) * 100;
          let pct = '—', pctCls = 'empty';
          if (r.prev && r.prev > 0) {
            const p = (r.v / r.prev) * 100;
            pct = p.toFixed(1) + '%';
            if (p < 10) pctCls = 'bad';
            else if (p < 30) pctCls = 'low';
            else pctCls = '';
          }
          return `
            <div class="funnel-row">
              <div class="funnel-label">${r.lbl}</div>
              <div class="funnel-bar-bg">
                <div class="funnel-bar-fill" style="width: ${Math.max(w, 4)}%">
                  ${r.hint || ''}
                </div>
              </div>
              <div class="funnel-value">${fmtInt(r.v)}</div>
              <div class="funnel-pct ${pctCls}">${pct}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ───────── RENDER: retenção vídeo ───────── */
function renderVideo(a) {
  const sum = (k) => a.days.reduce((s,d) => s + (d[k] || 0), 0);
  const reproducoes = sum('reproducoes');
  if (!reproducoes) return '';
  const v3seg = sum('v3seg'), v25 = sum('v25'), v50 = sum('v50');
  const v75 = sum('v75'), v95 = sum('v95'), v100 = sum('v100');
  const thruplays = sum('thruplays');
  const gasto = sum('gasto');

  const base = reproducoes;
  const pct = (v) => ((v / base) * 100).toFixed(1) + '%';
  const fill = (v) => Math.min(100, (v / base) * 100).toFixed(0) + '%';

  const custo95   = v95 > 0 ? gasto / v95 : 0;
  const custo100  = v100 > 0 ? gasto / v100 : 0;
  const custoThru = thruplays > 0 ? gasto / thruplays : 0;

  return `
    <div class="section-title">Retenção de vídeo</div>
    <div class="card">
      <div class="card-title">Quantas pessoas assistiram cada % do criativo</div>
      <div class="card-sub">Base: ${fmtInt(reproducoes)} reproduções totais · ThruPlay = vídeo até 95% ou ≥ 15s</div>
      <div class="video-bars">
        <div class="video-step" style="--fill: ${fill(v3seg)}"><div class="video-step-label">3 seg</div><div class="video-step-value">${fmtInt(v3seg)}</div><div class="video-step-sub">${pct(v3seg)}</div></div>
        <div class="video-step" style="--fill: ${fill(v25)}"><div class="video-step-label">25%</div><div class="video-step-value">${fmtInt(v25)}</div><div class="video-step-sub">${pct(v25)}</div></div>
        <div class="video-step" style="--fill: ${fill(v50)}"><div class="video-step-label">50%</div><div class="video-step-value">${fmtInt(v50)}</div><div class="video-step-sub">${pct(v50)}</div></div>
        <div class="video-step" style="--fill: ${fill(v75)}"><div class="video-step-label">75%</div><div class="video-step-value">${fmtInt(v75)}</div><div class="video-step-sub">${pct(v75)}</div></div>
        <div class="video-step" style="--fill: ${fill(v95)}"><div class="video-step-label">95%</div><div class="video-step-value">${fmtInt(v95)}</div><div class="video-step-sub">${pct(v95)} · ${fmtBRL(custo95)}/view</div></div>
        <div class="video-step" style="--fill: ${fill(v100)}"><div class="video-step-label">100%</div><div class="video-step-value">${fmtInt(v100)}</div><div class="video-step-sub">${pct(v100)} · ${fmtBRL(custo100)}/view</div></div>
        <div class="video-step" style="--fill: ${fill(thruplays)}"><div class="video-step-label">ThruPlay</div><div class="video-step-value">${fmtInt(thruplays)}</div><div class="video-step-sub">${pct(thruplays)} · ${fmtBRL(custoThru)}/view</div></div>
      </div>
    </div>
  `;
}

/* ───────── RENDER: heatmap por dia (custo por compra) ───────── */
function renderHeatmap(a) {
  if (!a.days.length) return '';
  const validDays = a.days.filter(d => d.custoCompra > 0);
  if (!validDays.length) return '';
  const min = Math.min(...validDays.map(d => d.custoCompra));
  const max = Math.max(...validDays.map(d => d.custoCompra));

  // melhor e pior dia
  const best = validDays.reduce((b,d) => d.custoCompra < b.custoCompra ? d : b, validDays[0]);
  const worst = validDays.reduce((b,d) => d.custoCompra > b.custoCompra ? d : b, validDays[0]);

  const colorFor = (v) => {
    // verde → amarelo → vermelho
    const t = max === min ? 0.5 : (v - min) / (max - min);
    let r, g, b;
    if (t < 0.5) {
      // verde (29,158,117) → amarelo (212,148,30)
      const tt = t * 2;
      r = Math.round(29 + (212 - 29) * tt);
      g = Math.round(158 + (148 - 158) * tt);
      b = Math.round(117 + (30 - 117) * tt);
    } else {
      // amarelo → vermelho (216,61,61)
      const tt = (t - 0.5) * 2;
      r = Math.round(212 + (216 - 212) * tt);
      g = Math.round(148 + (61 - 148) * tt);
      b = Math.round(30 + (61 - 30) * tt);
    }
    return `rgba(${r},${g},${b},0.35)`;
  };
  const borderFor = (v) => {
    const t = max === min ? 0.5 : (v - min) / (max - min);
    return t < 0.5 ? 'rgba(29,158,117,0.6)' : (t > 0.75 ? 'rgba(216,61,61,0.7)' : 'rgba(212,148,30,0.6)');
  };

  return `
    <div class="section-title">Heatmap diário · custo por compra</div>
    <div class="card">
      <div class="card-title">Verde = barato · Vermelho = caro</div>
      <div class="card-sub">
        Melhor: <strong style="color:#4ed5a4">${best.diaShort}</strong> (${fmtBRL(best.custoCompra)} · ${best.compras} compras) ·
        Pior: <strong style="color:#ff8484">${worst.diaShort}</strong> (${fmtBRL(worst.custoCompra)} · ${worst.compras} compras)
      </div>
      <div class="heat-grid">
        ${a.days.map(d => {
          const isToday = d.diaShort === todayShort;
          const bg = d.custoCompra > 0 ? colorFor(d.custoCompra) : 'transparent';
          const bd = d.custoCompra > 0 ? borderFor(d.custoCompra) : 'var(--border)';
          return `
            <div class="heat-cell ${isToday ? 'today' : ''}" style="background: ${bg}; border-color: ${bd}">
              <div class="heat-day">${d.diaShort}</div>
              <div class="heat-value">${d.custoCompra > 0 ? fmtBRL(d.custoCompra) : '—'}</div>
              <div class="heat-sub">${d.compras} compras</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ───────── RENDER: decisões recomendadas ───────── */
function renderDecisions(a) {
  const T = a.totals, tr = a.trends;
  const decisions = [];

  // Diagnóstico CPL real (custo por compra/ingresso)
  if (T.custoCpr > ALVO_CPL_PREJUIZO) {
    decisions.push({
      type: 'urgent', tag: 'Agir agora',
      title: 'Reduzir CPL urgente',
      body: `CPL em <strong>${fmtBRL(T.custoCpr)}</strong> · ticket médio R$ 17 → no prejuízo.<br>1. Pausar conjuntos com custo/compra > R$ 30.<br>2. Subir 3-5 criativos novos.<br>3. Reativar base antiga via e-mail.`
    });
  } else if (T.custoCpr > ALVO_CPL) {
    decisions.push({
      type: 'attention', tag: 'Otimizar',
      title: 'CPL acima do baseline T2',
      body: `CPL em <strong>${fmtBRL(T.custoCpr)}</strong> · alvo ≤ R$ ${ALVO_CPL} (T2 fechou R$ 19,78).<br>Identificar criativos com pior CTR e pausar. Subir variações dos melhores.`
    });
  } else if (T.custoCpr > 0 && T.custoCpr <= 20) {
    decisions.push({
      type: 'ok', tag: 'Manter',
      title: 'CPL no alvo',
      body: `CPL em <strong>${fmtBRL(T.custoCpr)}</strong>. Continuar com a estratégia atual e escalar verba nos criativos vencedores.`
    });
  }

  // Frequência
  if (T.freqMedia > 2.5 || tr.freqLast > 2.8) {
    decisions.push({
      type: 'attention', tag: 'Renovar criativos',
      title: 'Fadiga de audiência',
      body: `Frequência média <strong>${T.freqMedia.toFixed(2)}</strong>. Os mesmos perfis vendo o mesmo anúncio.<br>1. Subir 3-5 criativos novos (ângulo, gancho, hook).<br>2. Testar novos públicos (lookalike de compradores T2).`
    });
  }

  // CTR
  if (T.ctr < 1.5 && T.ctr > 0) {
    decisions.push({
      type: 'attention', tag: 'Testar ganchos',
      title: 'CTR baixo',
      body: `CTR em <strong>${T.ctr.toFixed(2)}%</strong> (alvo ≥ 2%).<br>O criativo não está prendendo. Mudar headline, thumb, 3 primeiros segundos do vídeo.`
    });
  } else if (T.ctr >= 2.5) {
    decisions.push({
      type: 'ok', tag: 'Escalar',
      title: 'CTR excelente',
      body: `CTR em <strong>${T.ctr.toFixed(2)}%</strong>. Os criativos prendem atenção. Identificar os 3 com melhor CTR individualmente e ampliar verba.`
    });
  }

  // Tendência piorando
  if (tr.custoCprLast > tr.custoCprFirst * 1.2 && tr.custoCprFirst > 0) {
    decisions.push({
      type: 'attention', tag: 'Atenção',
      title: 'Custo subindo nos últimos 3 dias',
      body: `Primeira semana: ${fmtBRL(tr.custoCprFirst)} → Últimos 3 dias: <strong>${fmtBRL(tr.custoCprLast)}</strong>.<br>Conferir se a queda de WhatsApp (58%) está reduzindo qualificação. Possível Letalk com erro.`
    });
  }

  // Volume baixo
  const dailyAvgGasto = T.gasto / a.days.length;
  if (dailyAvgGasto < 500) {
    decisions.push({
      type: 'attention', tag: 'Volume',
      title: 'Verba média baixa',
      body: `Gasto médio de <strong>${fmtBRL0(dailyAvgGasto)}/dia</strong>. Em T2 foi ~R$ 1.485/dia. Se o objetivo é repetir 2.000 leads, precisa aumentar verba ou prazo.`
    });
  }

  if (!decisions.length) {
    decisions.push({
      type: 'ok', tag: 'Sem alertas',
      title: 'Campanha dentro do esperado',
      body: 'Nenhuma decisão crítica no momento. Continuar monitorando e otimizando criativos.'
    });
  }

  return `
    <div class="section-title">Decisões recomendadas</div>
    <div class="decisions">
      ${decisions.map(d => `
        <div class="decision ${d.type}">
          <span class="decision-tag">${d.tag}</span>
          <div class="decision-title">${d.title}</div>
          <div class="decision-body">${d.body}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ───────── RENDER: tabela completa ───────── */
function renderFullTable(a) {
  if (!a.days.length) return '';
  const cols = [
    { lbl: 'Dia',          key: 'dia',           type: 'day' },
    { lbl: 'In.Checkout',  key: 'checkout',      type: 'int' },
    { lbl: 'Custo/Chk',    key: 'custoCheckout', type: 'brl', alert: (v) => v > 25 },
    { lbl: 'Cliques link', key: 'cliques',       type: 'int' },
    { lbl: 'Compras',      key: 'compras',       type: 'int' },
    { lbl: 'Custo/Compra', key: 'custoCompra',   type: 'brl', alert: (v) => v > 30, good: (v) => v > 0 && v < 18 },
    { lbl: 'Vis.Página',   key: 'visPagina',     type: 'int' },
    { lbl: 'Valor usado',  key: 'gasto',         type: 'brl' },
    { lbl: 'CTR',          key: 'ctr',           type: 'pct', alert: (v) => v < 1.5 && v > 0, good: (v) => v >= 2.5 },
    { lbl: 'CPM',          key: 'cpm',           type: 'brl' },
    { lbl: 'Connect Rate', key: 'connectRate',   type: 'pct' },
    { lbl: 'Compra/Pag',   key: 'compraPag',     type: 'pct' },
    { lbl: 'Chk/Pág',      key: 'checkoutPagina',type: 'pct' },
    { lbl: 'Compra/Chk',   key: 'compraCheckout',type: 'pct' },
    { lbl: 'Impressões',   key: 'impressoes',    type: 'int' },
    { lbl: 'Alcance',      key: 'alcance',       type: 'int' },
    { lbl: 'ThruPlays',    key: 'thruplays',     type: 'int' },
    { lbl: 'Custo/Thru',   key: 'custoThruplay', type: 'brl' },
    { lbl: '25%',          key: 'v25',           type: 'int' },
    { lbl: '50%',          key: 'v50',           type: 'int' },
    { lbl: '75%',          key: 'v75',           type: 'int' },
    { lbl: '95%',          key: 'v95',           type: 'int' },
    { lbl: '100%',         key: 'v100',          type: 'int' },
    { lbl: '3 seg',        key: 'v3seg',         type: 'int' },
    { lbl: 'Reproduções',  key: 'reproducoes',   type: 'int' },
    { lbl: 'Custo/95%',    key: 'custo95',       type: 'brl' },
    { lbl: 'Custo/100%',   key: 'custo100',      type: 'brl' },
    { lbl: 'Freq',         key: 'freq',          type: 'dec', alert: (v) => v > 2.5 }
  ];

  const renderCell = (d, col) => {
    if (col.type === 'day') return `<td class="day-cell">${d.dia}</td>`;
    const v = d[col.key] || 0;
    let txt;
    if (col.type === 'int') txt = fmtInt(v);
    else if (col.type === 'brl') txt = fmtBRL(v);
    else if (col.type === 'pct') txt = v.toFixed(2) + '%';
    else if (col.type === 'dec') txt = v.toFixed(2);
    else txt = v;
    let cls = '';
    if (col.alert && col.alert(v)) cls = 'alert-cell';
    else if (col.good && col.good(v)) cls = 'good-cell';
    return `<td class="num ${cls}">${txt}</td>`;
  };

  // linha total
  const totalRow = cols.map(col => {
    if (col.type === 'day') return `<td class="day-cell">TOTAL/MÉDIA</td>`;
    const total = a.days.reduce((s,d) => s + (d[col.key] || 0), 0);
    if (col.type === 'pct' || col.type === 'dec') {
      const avg = a.days.length ? total / a.days.length : 0;
      const txt = col.type === 'pct' ? avg.toFixed(2) + '%' : avg.toFixed(2);
      return `<td class="num">${txt}</td>`;
    }
    if (col.type === 'brl') {
      if (col.key === 'gasto') return `<td class="num">${fmtBRL0(total)}</td>`;
      const avg = a.days.length ? total / a.days.length : 0;
      return `<td class="num">${fmtBRL(avg)}</td>`;
    }
    return `<td class="num">${fmtInt(total)}</td>`;
  }).join('');

  return `
    <div class="section-title">Tabela completa · todos os dias · todas as 28 métricas</div>
    <div class="card">
      <div class="card-title">${a.days.length} dias com dados · scroll horizontal · coluna Dia fixa</div>
      <div class="card-sub">Vermelho = problema · Verde = excelente · Última linha = totais (brutos) e médias (taxas)</div>
      <div class="meta-full-wrap">
        <table class="meta-full">
          <thead>
            <tr>${cols.map(c => `<th class="${c.type === 'day' ? 'day-cell' : 'num'}">${c.lbl}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${a.days.map(d => {
              const isToday = d.diaShort === todayShort;
              return `<tr class="${isToday ? 'today-row' : ''}">${cols.map(c => renderCell(d, c)).join('')}</tr>`;
            }).join('')}
            <tr class="total-row">${totalRow}</tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ───────── LOAD ───────── */
async function loadAll(force = false) {
  const target = document.getElementById('content');
  if (force) target.innerHTML = '<div class="loading">Atualizando…</div>';
  try {
    const csv = await fetch(csvUrl()).then(r => r.text());
    const rows = parseCSV(csv);
    const days = parseLeadsFb(rows);
    if (!days.length) {
      target.innerHTML = '<div class="error">Sem dados na aba Leads FB. Verifique se a planilha continua publicada.</div>';
      return;
    }
    const a = analyse(days);

    target.innerHTML =
      renderAlerts(a) +
      renderKpis(a) +
      renderEvolution(a) +
      renderHeatmap(a) +
      renderFunnel(a) +
      renderVideo(a) +
      renderDecisions(a) +
      renderFullTable(a);

    document.getElementById('last-update').textContent =
      new Date().toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch (err) {
    target.innerHTML = `
      <div class="error">
        <strong>Erro ao carregar dados.</strong><br>
        ${err.message}<br><br>
        Verifique se a planilha continua publicada em <em>Arquivo → Compartilhar → Publicar na web</em>.
      </div>
    `;
    console.error(err);
  }
}

loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
