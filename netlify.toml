[build]
  publish = "."

[dev]
  port = 8888
  framework = "#static"
  autoLaunch = false

# CDN de imagens (aceita qualquer URL externa)
[images]
  remote_images = ["https://.*"]

# Redirect www → apex
[[redirects]]
  from = "https://www.example.com/*"
  to = "https://example.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/dash-palmira/*"
  to = "/dashboard-palmira/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/dash-palmira"
  to = "/dashboard-palmira"
  status = 301
  force = true

# Rewrites para manter as URLs originais após renomeação das pastas
[[redirects]]
  from = "/v1/*"
  to = "/spt-v1/:splat"
  status = 200

[[redirects]]
  from = "/v1"
  to = "/spt-v1"
  status = 200

[[redirects]]
  from = "/v2/*"
  to = "/spt-v2/:splat"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/spt-v2"
  status = 200

[[redirects]]
  from = "/vsl3/*"
  to = "/spt-vsl3/:splat"
  status = 200

[[redirects]]
  from = "/vsl3"
  to = "/spt-vsl3"
  status = 200

[[redirects]]
  from = "/v3/*"
  to = "/mpa-n1-v3/:splat"
  status = 200

[[redirects]]
  from = "/v3"
  to = "/mpa-n1-v3"
  status = 200

[[redirects]]
  from = "/vsl1/*"
  to = "/mpa-n1-ev-vsl1/:splat"
  status = 200

[[redirects]]
  from = "/vsl1"
  to = "/mpa-n1-ev-vsl1"
  status = 200

# Coleção Pombagira - Aula aberta (jul/26)
# Pagina de obrigado com URL curta na raiz
[[redirects]]
  from = "/obrigado-cp-jul26.html"
  to = "/cp-jul26/obrigado-cp-jul26.html"
  status = 200


# Headers de seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache para assets estaticos
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
