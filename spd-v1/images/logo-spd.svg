<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&amp;family=Outfit:wght@400;600&amp;display=swap');
            
            .text-top {
                font-family: 'Outfit', sans-serif;
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.6em;
                fill: #d4a031;
                text-transform: uppercase;
            }
            
            .text-main {
                font-family: 'Philosopher', serif;
                font-size: 48px;
                font-weight: 700;
                fill: #8d1a47;
            }
        </style>
    </defs>
    
    <!-- Text Only -->
    <g transform="translate(5, 40)">
        <text x="5" y="0" class="text-top">Semana</text>
        <text x="0" y="48" class="text-main">Perfumaria das Deusas</text>
    </g>
</svg>
