<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Inscrição Confirmada! | Semana Perfumaria das Deusas</title>

    <link rel="preload" href="/spd-v1/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/spd-v1/fonts/philosopher-700.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url(/spd-v1/fonts/outfit.woff2) format('woff2');
        }

        @font-face {
            font-family: 'Philosopher';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url(/spd-v1/fonts/philosopher-700.woff2) format('woff2');
        }

        :root {
            --clr-vinho: #8d1a47;
            --clr-verde: #397d7f;
            --clr-bg: #fff;
            --clr-bg-cream: #fdf8f0;
            --clr-text: #1a1a1a;
            --clr-text-muted: #555;
            --radius: 12px;
            --font-heading: 'Philosopher', Georgia, serif;
            --font-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--clr-bg-cream);
            color: var(--clr-text);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .btn {
            display: inline-block;
            padding: 1.2rem 3rem;
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: .1em;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-align: center;
            background: var(--clr-verde);
            color: #fff;
        }

        .thank-you {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .thank-you__card {
            background: var(--clr-bg);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(141, 26, 71, .1);
        }

        .thank-you__icon {
            width: 80px;
            height: 80px;
            background: rgba(57, 125, 127, .1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--clr-verde);
        }

        .thank-you__icon svg {
            width: 40px;
            height: 40px;
        }

        .thank-you__title {
            font-family: var(--font-heading);
            font-weight: 700;
            line-height: 1.15;
            color: var(--clr-vinho);
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 1rem;
        }

        .thank-you__text {
            font-size: 1.1rem;
            color: var(--clr-text-muted);
            margin-bottom: 2rem;
        }

        .thank-you__action {
            margin-bottom: 1.5rem;
        }

        .thank-you__notice {
            font-size: .85rem;
            color: var(--clr-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
        }

        .thank-you__notice svg {
            width: 14px;
            height: 14px;
            stroke: var(--clr-verde);
        }
    </style>
</head>

<body>
    <main class="thank-you">
        <div class="thank-you__card">
            <div class="thank-you__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>

            <h1 class="thank-you__title">Inscrição Confirmada!</h1>

            <p class="thank-you__text">
                Parabéns! Sua vaga para a Semana Perfumaria das Deusas está garantida. Agora, o passo mais importante é entrar no nosso grupo exclusivo para receber os avisos e o link de acesso das aulas.
            </p>

            <div class="thank-you__action">
                <a href="https://chat.whatsapp.com/Iy1LVObq1j75U95RfobPD5" class="btn" id="whatsapp-btn">Entrar no Grupo de Acesso</a>
            </div>

            <p class="thank-you__notice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Ambiente seguro e livre de spam.
            </p>
        </div>
    </main>

    </script>
</body>

</html>
