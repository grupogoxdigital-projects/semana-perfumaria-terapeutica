<head>
    <meta charset="UTF-8">

    <title>Inscrição Confirmada! | Semana Perfumaria das Deusas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
    <link rel="stylesheet" href="/spd-v1/style.css">
    
    <style>
        .thank-you {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--clr-bg-cream);
            padding: 2rem 1rem;
            text-align: center;
        }

        .thank-you__card {
            background: var(--clr-bg);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(141, 26, 71, 0.08);
            border: 1px solid rgba(141, 26, 71, 0.1);
        }

        .thank-you__icon {
            width: 80px;
            height: 80px;
            background: rgba(57, 125, 127, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: var(--clr-verde);
        }

        .thank-you__icon svg {
            width: 40px;
            height: 40px;
        }

        .thank-you__title {
            color: var(--clr-vinho);
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            margin-bottom: 1rem;
        }

        .thank-you__text {
            font-size: 1.1rem;
            color: var(--clr-text-muted);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .thank-you__action {
            margin-bottom: 1.5rem;
        }

        .thank-you__notice {
            font-size: 0.85rem;
            color: var(--clr-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .thank-you__notice svg {
            width: 14px;
            height: 14px;
            stroke: var(--clr-verde);
        }
    </style>

    <main class="thank-you">
        <div class="thank-you__card">
            <div class="thank-you__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>

            <h1 class="thank-you__title">Inscrição Confirmada!</h1>

            <p class="thank-you__text">
                Parabéns! Sua vaga para a Semana Perfumaria das Deusas está garantida. Agora, o passo mais importante é entrar no nosso grupo exclusivo para receber os avisos e o link de acesso das aulas.
            </p>

            <div class="thank-you__action">
                <a href="https://chat.whatsapp.com/Iy1LVObq1j75U95RfobPD5" class="btn btn--verde btn--lg pulse-loop" id="whatsapp-btn">Entrar no Grupo de Acesso</a>
            </div>

            <p class="thank-you__notice">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Ambiente seguro e livre de spam.
            </p>
        </div>
    </main>
